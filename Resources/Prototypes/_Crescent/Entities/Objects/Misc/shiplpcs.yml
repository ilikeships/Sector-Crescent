



- type: entity
  parent: BaseItem
  id: ShipVoucherImparator
  name: DSM 'Imparator' pattern LPC fabprint disk
  description: An LPC fabprint disk loaded with an Imperial Imparator-class picket fighter. Has to be redeemed at a shipyard console.
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: _Crescent/Objects/Misc/lpcchip.rsi
    layers:
    - state: icon
  - type: StaticPrice
    price: 10000
  - type: ShipVoucher
    ship: Imparator

