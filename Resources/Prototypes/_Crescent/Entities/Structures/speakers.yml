- type: entity
  parent: [BaseStructure]
  id: BaseMusicSyndicate
  name: NCSP propaganda speaker
  description: Fills the emptiness and keeps your dopamine up, you sweet little killer.
  components:
  - type: Sprite
    sprite: _Crescent/Structures/speakers.rsi
    state: icon
  - type: AmbientSound
    enabled: true
    range: 200
    volume: -5
    sound:
     path: /Audio/_Crescent/Ambience/ncsp_base.ogg
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
          - MachineLayer


