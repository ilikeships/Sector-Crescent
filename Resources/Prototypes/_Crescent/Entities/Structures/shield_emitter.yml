- type: entity
  id: ShieldEmitter
  parent: BaseMachinePowered
  name: NT-910 'Goliath' deflector emitter
  description: A complicated array of machinery - guzzles power and maintains a bubble deflector shield around the mother vessel. Overheats with too much use.
  components:
  - type: AmbientOnPowered
  - type: AmbientSound
    volume: -9
    range: 3
    enabled: false
    sound:
      path: /Audio/Ambience/Objects/vending_machine_hum.ogg
  - type: Sprite
    sprite: _Crescent/Structures/shieldemitter.rsi
    state: icon
    snapCardinals: true
  - type: Physics
    bodyType: Static
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-2,-2.20,2,2.20"
        mask:
        - MachineMask
        layer:
        - MachineLayer
        density: 200
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
  - type: Repairable
    doAfterDelay: 8
  - type: Electrified
    enabled: true
    usesApcPower: true
    shockDamage: 60
  - type: PointLight
    enabled: false
    castShadows: true
    radius: 8
    color: "#90d5ff"
  - type: LitOnPowered
  - type: ApcPowerReceiver
    powerLoad: 50000
  - type: Actions
  - type: Appearance
  - type: ShipShieldEmitter
