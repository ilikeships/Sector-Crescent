- type: entity
  id: Factory
  parent: BaseLathe
  name: autolathe-factory
  description: It produces basic items using metal and glass and crafts by contact! wow!
  components:
  - type: Sprite
    sprite: Structures/Machines/autolathe.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: AutolatheMachineCircuitboard
  - type: MaterialStorage
    whitelist:
      tags:
        - Sheet
        - RawMaterial
        - Ingot
  - type: Factory
    sound:
      collection: CluwneHorn
      params:
        variation: 0.125
    recipes:
      rodToMetal:
        inputs:
          MetalRod:
            2
        outputs:
          SheetSteel:
            1
      metalToGun:
        inputs:
          MetalRod:
            3
          Steel:
            5
        outputs:
          WeaponPistolViper:
            1
          MagazinePistol:
            3


  - type: Lathe
    idleState: icon
    runningState: building
    staticRecipes:
      - Wirecutter
      - Igniter
      - Signaller
      - Screwdriver
      - Welder
      - Wrench
